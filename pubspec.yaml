name: monfathak_flutter
description: Monfathak Flutter client
publish_to: 'none'
version: 1.0.9+50

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  crypto: ^3.0.6
  http: ^1.6.0
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6
  flutter_local_notifications: ^22.2.0
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.3
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  google_fonts: ^8.2.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/monfathak_logo.png
